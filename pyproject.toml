[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "traffic-cnn"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = ["ultralytics>=8.3,<9", "opencv-python>=4.8,<5", "lap>=0.5.12,<0.6", "streamlit>=1.40,<2", "streamlit-image-coordinates>=0.4"]
[project.optional-dependencies]
live = ["yt-dlp"]
dev = ["pytest>=8"]
[project.scripts]
traffic-cnn = "traffic_cnn.cli:main"
[tool.setuptools.packages.find]
include = ["traffic_cnn*"]
